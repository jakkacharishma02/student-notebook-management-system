<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>6 Digit OTP Verification</title>

  <style>
    body{
  font-family: Arial, sans-serif;
  background:#e8e5de;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}

.container{
  background:#f7f7f7;
  padding:40px 35px;
  border-radius:25px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  width:420px;
  text-align:center;
}

h2{
  margin-bottom:12px;
  font-size:42px;
  color:#0f172a;
  font-weight:bold;
}

p{
  color:#666;
  font-size:15px;
  margin-bottom:30px;
}

.otp-box{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-bottom:30px;
}

.otp-input{
  width:55px;
  height:60px;
  text-align:center;
  font-size:24px;
  border:1px solid #d1d5db;
  border-radius:12px;
  outline:none;
  background:white;
  transition:0.3s;
}

.otp-input:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,0.2);
}

button{
  width:100%;
  padding:15px;
  border:none;
  background:#172338;
  color:white;
  font-size:17px;
  font-weight:bold;
  border-radius:14px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#0f172a;
}

b{
  display:block;
  margin-bottom:15px;
  color:red;
  font-size:14px;
}
  </style>
  
</head>
<body>

<div class="container">
    {% with messages = get_flashed_messages() %}
  {% if messages %}
    {% for message in messages %}
      <b>{{ message }}</b>
    {% endfor %}
  {% endif %}
{% endwith %}
  <h2>Verify OTP</h2>
  <p>Enter your 6-character OTP</p>

  <form method="POST">

    <div class="otp-box">
      <input type="text" maxlength="1" class="otp-input" required>
      <input type="text" maxlength="1" class="otp-input" required>
      <input type="text" maxlength="1" class="otp-input" required>
      <input type="text" maxlength="1" class="otp-input" required>
      <input type="text" maxlength="1" class="otp-input" required>
      <input type="text" maxlength="1" class="otp-input" required>
    </div>

    <!-- Hidden OTP -->
    <input type="hidden" name="otp" id="fullOtp">

    <button type="submit">Verify OTP</button>

  </form>
</div>

<script>
  const inputs = document.querySelectorAll(".otp-input");
  const fullOtp = document.getElementById("fullOtp");

  inputs.forEach((input, index) => {

    input.addEventListener("input", (e) => {

      // Allow only alphanumeric
      input.value = input.value.replace(/[^a-zA-Z0-9]/g, '');

      // Move next
      if(input.value.length === 1 && index < inputs.length - 1){
        inputs[index + 1].focus();
      }

      updateOTP();
    });

    input.addEventListener("keydown", (e) => {

      // Move back
      if(e.key === "Backspace" && input.value === "" && index > 0){
        inputs[index - 1].focus();
      }
    });
  });

  function updateOTP(){
    let otp = "";

    inputs.forEach(input => {
      otp += input.value;
    });

    fullOtp.value = otp;
  }
</script>

</body>
</html>
